<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>피아노 연습</title>
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <header class="toolbar">
    <button id="connect-usb" class="primary">피아노 연결</button>
    <button id="restart">처음부터</button>
    <span class="transport" role="group" aria-label="악보 듣기">
      <button id="listen-play" aria-label="듣기 재생"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/></svg></button>
      <button id="listen-stop" aria-label="듣기 정지" title="정지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5.5h13v13h-13z"/></svg></button>
    </span>
    <button id="record">녹음</button>
    <button id="range-pick">구간 설정</button>
    <button id="show-result">결과</button>
    <button id="settings-toggle" aria-expanded="false" aria-controls="settings">설정</button>
    <span class="spacer"></span>
    <button id="zoom-out" aria-label="악보 작게">−</button>
    <button id="zoom-in" aria-label="악보 크게">+</button>
  </header>

  <section id="settings" hidden>
    <label>곡
      <select id="song">
        <option value="hanon1">하농 1번</option>
        <option value="opened" id="song-opened" hidden></option>
        <option value="open">악보 파일 열기…</option>
      </select>
    </label>
    <input id="file" type="file" accept=".musicxml,.xml,.mxl" hidden>
    <label>손
      <select id="hand">
        <option value="both">양손</option>
        <option value="right">오른손</option>
        <option value="left">왼손</option>
      </select>
    </label>
    <label>모드
      <select id="mode">
        <option value="wait">연습모드</option>
        <option value="perform">연주모드</option>
        <option value="tempo">템포모드</option>
      </select>
    </label>
    <label>빠르기
      <input id="bpm" type="number" min="20" max="240" step="1" inputmode="numeric">
      <span class="unit">BPM</span>
    </label>
    <label class="tempo-only">박자 허용
      <select id="tol">
        <option value="0.06">엄격</option>
        <option value="0.1">보통</option>
        <option value="0.16">느슨</option>
      </select>
    </label>
    <label class="tempo-only check"><input id="metronome" type="checkbox"> 메트로놈</label>
    <label>구간
      <input id="from" type="number" inputmode="numeric" aria-label="시작 마디">
      <span class="unit">~</span>
      <input id="to" type="number" inputmode="numeric" aria-label="끝 마디">
      <span class="unit">마디</span>
    </label>
    <button id="range-all">전체 구간</button>
    <label class="check"><input id="loop" type="checkbox"> 구간 반복</label>
    <label>소리
      <select id="sound-out">
        <option value="phone">폰 스피커</option>
        <option value="piano">피아노로 재생</option>
      </select>
    </label>
    <div class="row">
      <button id="connect">블루투스 직접 연결</button>
      <button id="connect-all" hidden>모든 기기 보기</button>
    </div>
  </section>

  <main id="stage">
    <div id="sheet"></div>
    <div id="loading">악보를 불러오는 중…</div>
  </main>

  <div id="debug" hidden>
    <button id="debug-right">정답 입력</button>
    <button id="debug-wrong">틀린 음 입력</button>
  </div>

  <div id="take" hidden>
    <span id="take-info"></span>
    <button id="take-play">재생</button>
    <button id="take-save">저장</button>
    <button id="take-delete">지우기</button>
  </div>

  <footer class="status">
    <span id="link" class="pill off">연결 안 됨</span>
    <span id="progress">–</span>
    <span id="score">–</span>
    <span id="message"></span>
    <span id="version">v12</span>
  </footer>

  <div id="result" hidden>
    <div class="card">
      <h2 id="result-title"></h2>
      <p id="result-body"></p>
      <p id="result-hint" class="hint"></p>
      <div id="result-measures"></div>
      <div class="row center">
        <button id="result-again" class="primary">다시 연습</button>
        <button id="result-close">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
  <script type="module" src="js/app.js?v=12"></script>
</body>
</html>
